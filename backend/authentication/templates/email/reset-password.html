<!DOCTYPE html>
<html lang="es">
    <head>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap">
        <style>
            .reset-password-button {
                display: inline-block;
                padding: 10px 20px;
                background-color: #42469d;
                color: white;
                text-decoration: none;
                border-radius: 12px;
            }
        </style>
    </head>
    <body style="font-family: 'Montserrat', sans-serif; background-color: #f4f4f4; color: #333;">
        <div style="width: 100vw; padding: 20px;">
            <div style="border-bottom: 1px solid rgb(194, 194, 194);">
                <h1>Restablece tu contraseña</h1>
            </div>
            <p>Hola {{ first_name }}, haz click en el siguiente link para reestablecer tu contraseña: </p>
            <div style="text-align: center;">
                <a href="{{ password_reset_link }}" class="reset-password-button">
                    Restablecer contraseña
                </a>
            </div>
            <p>Si no solicitaste este código, puedes ignorar este mensaje.</p>
        </div>
        <div style="padding: 20px; color: gray;">
            <span>Atlana &copy; 2025</span>
        </div>
    </body>
</html>
